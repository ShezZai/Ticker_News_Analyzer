[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ticker-news-analyzer"
version = "0.2.0"
description = "AI-compute-sector stock news pipeline: collect, scrape, embed, classify, enrich, judge sentiment."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "playwright>=1.40",
    "psycopg[binary]>=3.2",
    "pgvector",
    "pydantic-settings>=2.6",
    "python-dotenv",
    "typer>=0.12",
    "langfuse>=4,<5",
    "langchain>=1.3,<2",
    "langgraph>=1.0,<2",
    "langchain-google-genai>=4.2,<5",
    "langchain-openai>=1.1,<2",
    "numpy",
    "tiktoken",
    "tqdm",
    "yfinance",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
ticker-news = "ticker_news.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ticker_news.scraping.store" = ["*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: tests that require a running Postgres (docker compose up -d)",
    "integration: tests that hit the live network",
]
